<script>
    // Simple script to handle file selection state for visual feedback
    document.addEventListener('DOMContentLoaded', () => {
        const fileUpload = document.getElementById('file-upload');
        const submitBtn = document.getElementById('submit-import');
        const dropZone = document.getElementById('drop-zone');

        // Handle file selection
        fileUpload.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                submitBtn.disabled = false;
                dropZone.classList.add('border-surface-tint', 'bg-surface-container-highest');
                dropZone.classList.remove('border-outline-variant/50', 'bg-surface-container-low');

                // Simple feedback showing file name could be added here
                const fileName = e.target.files[0].name;
                const textContainer = dropZone.querySelector('.text-center');
                textContainer.innerHTML = `<span class="font-label-md text-label-md text-surface-tint">${fileName}</span>
                                               <div class="font-body-md text-body-md text-on-surface-variant mt-1 text-sm">Файл готов к загрузке</div>`;
            } else {
                submitBtn.disabled = true;
                dropZone.classList.remove('border-surface-tint', 'bg-surface-container-highest');
                dropZone.classList.add('border-outline-variant/50', 'bg-surface-container-low');
            }
        });

        // Drag and drop visual feedback
        fileUpload.addEventListener('dragenter', () => {
            dropZone.classList.add('drag-over');
        });

        fileUpload.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        fileUpload.addEventListener('drop', () => {
            dropZone.classList.remove('drag-over');
        });
    });
</script>
